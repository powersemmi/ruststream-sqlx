# cargo-deny configuration: the dependency-graph half of the security gate.
# Checks RustSec advisories, license compatibility, duplicate versions, and
# registry sources. Run locally with `just deny`.

[graph]
all-features = true

[advisories]
yanked = "deny"

ignore = []

[licenses]
# Apache-2.0/MIT-compatible permissive licenses only.
allow = [
    "Apache-2.0",
    "MIT",
    # unicode-ident (behind syn and proc-macro2) is (MIT OR Apache-2.0) AND Unicode-3.0; the
    # Unicode license only covers the embedded character tables and is permissive.
    "Unicode-3.0",
    # foldhash, behind sqlx's hash maps: OSI-approved and permissive.
    "Zlib",
]

[bans]
# clippy::cargo's multiple_crate_versions is allowed in the workspace lints, so
# a duplicate in a transitive dependency's tree warns here instead of failing:
# the report stays visible without blocking on another crate's dependency
# choices.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
