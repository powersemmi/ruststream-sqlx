# A repo-unique project name: sibling repositories run their own compose stacks on this machine,
# and a shared name would make `docker compose down` reap their containers too.
name: ruststream-sqlx-tests

# The database the live suites run against:
#
#   * postgres - postgres://ruststream:ruststream@127.0.0.1:55432/ruststream   (POSTGRES_TEST_URL)
#
# Each live test creates a database of its own on this server and drops it when it finishes, so
# the user is a superuser. The server runs on the host network and without durability: a published
# port goes through docker's userland proxy, which copies every packet of every round trip, and
# `fsync` puts a disk flush under every commit. Neither is what the tests measure. Port 55432 keeps
# clear of a Postgres the machine may already run on 5432.

services:
  postgres:
    image: postgres:17-alpine
    container_name: ruststream-sqlx-postgres
    network_mode: host
    environment:
      POSTGRES_USER: ruststream
      POSTGRES_PASSWORD: ruststream
      POSTGRES_DB: ruststream
    command:
      - postgres
      - -c
      - port=55432
      - -c
      - listen_addresses=127.0.0.1
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=300
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "55432", "-U", "ruststream", "-d", "ruststream"]
      interval: 1s
      timeout: 2s
      retries: 20
      start_period: 1s
