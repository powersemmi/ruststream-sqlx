[workspace]
resolver = "3"
members = [
    "crates/ruststream-sqlx",
    "crates/ruststream-sqlx-dialect",
    "crates/ruststream-sqlx-macros",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream-sqlx"
authors = ["RustStream contributors"]

[workspace.dependencies]
# The three published crates move in lockstep: one version, exact pins between them.
ruststream-sqlx-dialect = { version = "=0.7.0", path = "crates/ruststream-sqlx-dialect" }
ruststream-sqlx-macros = { version = "=0.7.0", path = "crates/ruststream-sqlx-macros" }

# The casing functions sqlx's own derives apply for `rename_all`, at the version sqlx 0.9 uses.
heck = "0.5"
proc-macro2 = "1"
quote = "1"
syn = "3"
thiserror = "2"
trybuild = "1.0.121"
ruststream = { version = "0.7", default-features = false }
# The driver comes from the `postgres` feature; TLS and the compile-time macros come from the
# service's own sqlx dependency, which cargo unifies with this one.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio"] }
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
tokio = { version = "1.44", default-features = false }
tokio-util = { version = "0.7.10", default-features = false }
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
sync_wrapper = "1"
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }
time = { version = "0.3.36", default-features = false, features = ["std"] }
serde = { version = "1.0.217", default-features = false, features = ["std", "derive"] }
serde_json = "1.0.135"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"
