[workspace]
resolver = "3"
members = [
    "crates/ruststream-sqlx",
    "crates/ruststream-sqlx-dialect",
    "crates/ruststream-sqlx-macros",
    "examples/outbox",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream-sqlx"
authors = ["RustStream contributors"]

[workspace.dependencies]
# The three published crates move in lockstep: one version, exact pins between them.
ruststream-sqlx-dialect = { version = "=0.7.0", path = "crates/ruststream-sqlx-dialect" }
ruststream-sqlx-macros = { version = "=0.7.0", path = "crates/ruststream-sqlx-macros" }

# The casing functions sqlx's own derives apply for `rename_all`, at the version sqlx 0.9 uses.
heck = "0.5"
proc-macro2 = "1"
quote = "1"
syn = "3"
thiserror = "2"
trybuild = "1.0.121"
ruststream = { version = "0.7.1", default-features = false }
# The drivers come from the `postgres` and `mysql` features; TLS and the compile-time macros come
# from the service's own sqlx dependency, which cargo unifies with this one.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio"] }
# The transaction manager the crate's own transactions call: sqlx re-exports its `Transaction`,
# not the trait behind it. The version sqlx itself pins.
# FIXME(sqlx-mysql 0.9.0): the crate keeps transactions of its own only because a rollback that
# sqlx-mysql queues after a cancelled prepare hangs `Pool::close()` (see `Tx` in the inbox). Once
# sqlx fixes that, `sqlx::Transaction` serves the inbox and this dependency goes.
sqlx-core = { version = "0.9", default-features = false }
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
tokio = { version = "1.44", default-features = false }
tokio-util = { version = "0.7.10", default-features = false }
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
sync_wrapper = "1"
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }
# `formatting`: a `time::OffsetDateTime` header field is written in RFC 3339.
time = { version = "0.3.36", default-features = false, features = ["std", "formatting"] }
serde = { version = "1.0.217", default-features = false, features = ["std", "derive"] }
serde_json = "1.0.135"
# `Routed` publishes keep the route's future in place: a slot of fixed size, one function pointer
# per poll, a box only for a future larger than the slot.
stackfuture = "0.3.1"
# The route table's hasher: already in the tree behind sqlx's hash maps.
foldhash = { version = "0.2", default-features = false }
# The allocation pin: counts every allocation of its test process.
dhat = "0.3.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"
